name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_rank=true&show_icons=true&include_all_commits=true&count_private=true&theme=transparent&title_color=32CD32&text_color=FFFF&icon_color=A020F0&border_color=A020F0
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Generate top langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=4&theme=transparent&title_color=32CD32&text_color=FFFF&border_color=A020F0&hide_title=true
          path: profile/langs.svg
          token: ${{ secrets.GRS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
